<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q4 skills test</title>
</head>
<body>
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#ececec;
        }

        .loginbox{
            width:350px;
            background:white;
            padding:30px;
            border-radius:14px;
            box-shadow:0px 0px 8px lightgray;
            margin:auto;
            margin-top:120px;
        }

        .loginbox h1{
            margin-bottom:10px;
        }

        .small{
            color:gray;
            font-size:14px;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:11px;
            margin-top:12px;
            border:1px solid #cfcfcf;
            border-radius:7px;
        }

        button{
            width:100%;
            padding:11px;
            margin-top:20px;
            border:none;
            background:#1f2430;
            color:white;
            border-radius:7px;
            cursor:pointer;
        }

        button:hover{
            background:#2d3445;
        }

        .forgot{
            font-size:13px;
            color:gray;
            margin-top:15px;
            text-align:center;
        }

    </style>

</head>

<body>

    <div class="loginbox">

        <h1>Student Login</h1>

        <p class="small">Use your school account to continue.</p>

        <input type="text" id="user" placeholder="Student ID">

        <input type="password" id="pass" placeholder="Password">

        <button onclick="login()">LOGIN</button>

        <p class="forgot">OBMV Portal 2025-2026</p>

    </div>



<script>

    function login(){

        var username = document.getElementById("user").value;
        var password = document.getElementById("pass").value;

        if(username == "student67" && password == "pass67")
        {
            window.location.href = "notebooks.html";
        }

        else{

            alert("Incorrect username or password");

        }

    }

</script>

</body>
</html>
